    description: '+ Mean Teacher pseudo-labels, annotations withheld within training set'
  - name: optional_sam2_distillation
    visual_only: false
    temporal: true
    description: 'Optional SAM2 mask-prompted offline teacher on TRAIN only'
  - name: optional_lora
    visual_only: false
    temporal: true
    description: 'Pointwise-convolution LoRA adapter ablation'
robustness_tests:
  - clean
  - blur
  - noise
  - fog
  - dark
notes:
