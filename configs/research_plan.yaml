    visual_only: true
    temporal: false
    unlabeled_fraction: 0
    description: 'FastViT + FPN visual-only baseline'
  - name: E1_text_static
    visual_only: false
    temporal: false
    unlabeled_fraction: 0
    description: '+ CLIP embedding FiLM'
  - name: E2_text_temporal
    visual_only: false
    temporal: true
    unlabeled_fraction: 0
    description: '+ temporal ConvGRU'
  - name: E3_cross_attention_presence
    visual_only: false
    temporal: true
    presence_head: true
    text_fusion: token_level_cross_attention
    status: evaluated_locally
    description: 'FastViT + CLIP token-level cross-attention + ConvGRU + presence'
  - name: optional_ssl_pretraining
    visual_only: false
    temporal: true
    status: exploratory_not_part_of_reported_results
