  - 'Validation valid_u annotations must not contribute to training or pseudo-label generation.'
  - 'Ablation: keep train budget, image resolution and samples identical.'
  - 'Report mean +/- std across 3 random seeds if compute allows.'
  - 'Metrics in local script are proxy; official MeViS evaluator needed for leaderboard.'
